<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEFENXUS - Defend the Crystal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container"></div>

  <!-- UI Overlays -->
  <div id="hud" class="hud">
    <div class="wave-info">
      <div class="wave-number">WAVE <span id="wave-current">0</span> / <span id="wave-max">20</span></div>
      <div class="crystal-hp">
        수정 HP <span id="crystal-hp">10000</span> / <span id="crystal-max">10000</span>
      </div>
    </div>

    <div class="player-stats">
      <div class="essence">정수(✦) <span id="essence">0</span></div>
      <div class="level">Lv. <span id="level">1</span></div>
      <div class="highest">최고 <span id="highest-wave">-</span></div>
    </div>

    <div class="buttons">
      <button id="btn-pause" class="btn">⏸ 일시정지</button>
      <button id="btn-menu" class="btn">☰ 메뉴</button>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="menu-main" class="modal active">
    <div class="modal-content">
      <h1>DEFENXUS</h1>
      <p class="subtitle">DEFEND THE CRYSTAL</p>

      <div class="menu-buttons">
        <button id="btn-quick-game" class="btn-large">
          <span class="label">빠른 게임</span>
          <span class="desc">혼자서 바로 시작</span>
        </button>
        <button id="btn-create-room" class="btn-large">
          <span class="label">방 만들기</span>
          <span class="desc">파티 설정 · 방 코드 생성</span>
        </button>
        <button id="btn-join-room" class="btn-large">
          <span class="label">방 참가하기</span>
          <span class="desc">방 코드로 입장</span>
        </button>
        <button id="btn-shop" class="btn-large">
          <span class="label">상점 · 캐릭터 강화</span>
          <span class="desc">영혼조각으로 영구 성장</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div id="menu-shop" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>상점 · 캐릭터 강화</h2>
        <button class="btn-close" data-close="menu-shop">✕</button>
      </div>

      <div class="shop-content">
        <div class="shop-section">
          <h3>영혼조각으로 구입</h3>
          <div class="soul-fragments">영혼조각: <span id="soul-count">0</span></div>
          <div class="shop-items" id="shop-items">
            <!-- 상점 아이템이 동적으로 생성됨 -->
          </div>
        </div>

        <div class="shop-section">
          <h3>통계</h3>
          <div class="stats-grid">
            <div class="stat">
              <span class="stat-label">최고 파동</span>
              <span class="stat-value" id="stat-highest">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">총 처치</span>
              <span class="stat-value" id="stat-kills">0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="menu-gameover" class="modal">
    <div class="modal-content">
      <h2>GAME OVER</h2>
      <div class="gameover-stats">
        <div class="stat-row">
          <span>도달한 파동:</span>
          <span id="gameover-wave">0</span>
        </div>
        <div class="stat-row">
          <span>처치 적:</span>
          <span id="gameover-kills">0</span>
        </div>
        <div class="stat-row">
          <span>획득 정수:</span>
          <span id="gameover-essence">0</span>
        </div>
      </div>
      <button id="btn-restart" class="btn-large">다시 시작</button>
      <button id="btn-back-menu" class="btn-large">메뉴로 돌아가기</button>
    </div>
  </div>

  <!-- Multiplayer Lobby -->
  <div id="menu-lobby" class="modal">
    <div class="modal-content">
      <h2>파티 설정</h2>
      <div class="lobby-content">
        <div class="room-info">
          <div class="info-row">
            <span>방 코드:</span>
            <span class="code" id="room-code">-</span>
            <button class="btn-copy">복사</button>
          </div>
          <div class="info-row">
            <span>플레이어:</span>
            <span id="player-count">1/4</span>
          </div>
        </div>

        <div class="player-list" id="player-list">
          <!-- 플레이어 목록이 동적으로 생성됨 -->
        </div>

        <div class="lobby-buttons">
          <button id="btn-start-game" class="btn-large">게임 시작</button>
          <button id="btn-leave-room" class="btn-large btn-cancel">나가기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pause Menu -->
  <div id="menu-pause" class="modal">
    <div class="modal-content">
      <h2>일시정지됨</h2>
      <div class="pause-buttons">
        <button id="btn-resume" class="btn-large">계속하기</button>
        <button id="btn-quit" class="btn-large btn-cancel">메뉴로 나가기</button>
      </div>
    </div>
  </div>

  <!-- Wave Clear Upgrade Modal -->
  <div id="menu-wave-clear" class="modal">
    <div class="modal-content">
      <h2>파동 클리어!</h2>
      <p class="subtitle">수정 업그레이드를 선택하세요</p>
      <div class="upgrade-options" id="wave-upgrades">
        <!-- 업그레이드 옵션이 동적으로 생성됨 -->
      </div>
    </div>
  </div>

  <!-- Level Up Modal -->
  <div id="menu-levelup" class="modal">
    <div class="modal-content">
      <h2>레벨 업!</h2>
      <p class="subtitle">캐릭터 강화를 선택하세요</p>
      <div class="upgrade-options" id="levelup-upgrades">
        <!-- 강화 옵션이 동적으로 생성됨 -->
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/waves.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/network.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
