<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>2D 횡스크롤 RPG 프로토타입</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="rotate-warning">
  <div>📱↻</div>
  <div>가로 모드로 회전해주세요<br>이 게임은 가로 화면 전용입니다.</div>
</div>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <!-- 상단바 -->
    <div id="top-bar">
      <div class="profile-chip">프로필</div>
      <div class="stat-group">❤️
        <div class="bar-track"><div id="top-hp-bar" class="bar-fill"></div></div>
        <span id="top-hp">100/100</span>
      </div>
      <div class="stat-group">🔵
        <div class="bar-track"><div id="top-mp-bar" class="bar-fill"></div></div>
        <span id="top-mp">50/50</span>
      </div>
      <div class="stat-group"><span id="top-level">Lv.1</span>
        <div class="bar-track exp-track"><div id="top-exp-bar" class="bar-fill"></div></div>
      </div>
      <div class="stat-group" id="top-gold">80</div>
      <div class="top-right-icons">
        <button class="icon-btn" id="btn-settings">⚙ 설정</button>
        <button class="icon-btn" id="btn-achievements">🏆 업적</button>
        <button class="icon-btn" id="btn-dex">📖 도감</button>
      </div>
    </div>

    <!-- 좌측 목표 / 파티 패널 -->
    <div id="left-panel"></div>

    <!-- 보스 체력바 -->
    <div id="boss-bar" class="hidden">
      <div id="boss-bar-label"></div>
      <div id="boss-bar-track"><div id="boss-bar-fill"></div></div>
    </div>

    <!-- 상호작용 프롬프트 -->
    <div id="interact-prompt" class="hidden clickable"></div>

    <!-- 토스트 -->
    <div id="toast" class="hidden"></div>

    <!-- 도움 요청 (던전에서만 표시) -->
    <button id="btn-help-request">🆘 도움 요청</button>

    <!-- 하단바 -->
    <div id="bottom-bar">
      <div id="move-buttons">
        <button class="pad-btn" id="btn-left">←</button>
        <button class="pad-btn" id="btn-right">→</button>
      </div>

      <div id="menu-icons">
        <button class="menu-icon-btn" id="btn-menu-bag"><span class="ico">🎒</span>가방</button>
        <button class="menu-icon-btn" id="btn-menu-character"><span class="ico">🧍</span>캐릭터</button>
        <button class="menu-icon-btn" id="btn-menu-skill"><span class="ico">📘</span>스킬</button>
        <button class="menu-icon-btn" id="btn-menu-shop"><span class="ico">🏬</span>상점</button>
        <button class="menu-icon-btn" id="btn-menu-menu"><span class="ico">☰</span>메뉴</button>
      </div>

      <div id="action-buttons">
        <button class="pad-btn" id="btn-attack">⚔</button>
        <button class="pad-btn" id="btn-jump">↑</button>
      </div>
    </div>

    <!-- 장비 상점 모달 -->
    <div id="modal-shop" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" data-target="modal-shop">✕</button>
        <h3>🏪 장비 상점</h3>
        <div id="shop-body"></div>
      </div>
    </div>

    <!-- 회복 상점 모달 -->
    <div id="modal-heal" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" data-target="modal-heal">✕</button>
        <h3>➕ 회복 상점</h3>
        <div class="heal-row"><span>HP 회복</span><button id="btn-heal-hp" class="action-btn">회복하기</button></div>
        <div class="heal-row"><span>MP 회복</span><button id="btn-heal-mp" class="action-btn">회복하기</button></div>
      </div>
    </div>

    <!-- 포탈(층 이동) 모달 -->
    <div id="modal-portal" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" data-target="modal-portal">✕</button>
        <h3>🔮 층 이동</h3>
        <div id="portal-body"></div>
      </div>
    </div>

    <!-- 파티 구성 모달 -->
    <div id="modal-party" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" data-target="modal-party">✕</button>
        <h3>🕳️ 던전 입장 - 파티 구성</h3>
        <div id="party-body"></div>
        <button id="btn-dungeon-enter" class="action-btn" style="margin-top:12px;width:100%;">던전 입장</button>
      </div>
    </div>

    <!-- 던전 클리어 모달 -->
    <div id="modal-clear" class="modal hidden">
      <div class="modal-box">
        <h3>🎉 던전 클리어</h3>
        <div id="clear-body"></div>
        <button id="btn-clear-confirm" class="action-btn" style="margin-top:12px;width:100%;">광장으로 돌아가기</button>
      </div>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/camera.js"></script>
<script src="js/player.js"></script>
<script src="js/enemy.js"></script>
<script src="js/npc.js"></script>
<script src="js/party.js"></script>
<script src="js/world.js"></script>
<script src="js/huntingArea.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/ui.js"></script>
<script src="js/gameManager.js"></script>
<script src="js/main.js"></script>
</body>
</html>
